name: tests

# alpha-engine-config-I7980.
#
# This repo has carried 78 tests under scripts/ since 2026-05-01 and NO JOB
# HAS EVER RUN THEM. The cost was measured the day this workflow was added:
# `test_dry_run_writes_nothing` shipped in the SAME COMMIT as the code it
# tests (#10) and had been failing for 112 days. It asserted that the S3 key
# carried `--detected-at`'s date while `s3_keys()` builds the key from
# `ts_utc`, which defaults to now — so the test was green on exactly one day,
# 2026-05-01, when the wall clock happened to equal the fixture's date.
#
# A test that is green on the day it is written and red every day after is
# indistinguishable from a passing test to anyone who does not run it. The
# only thing that separates them is a job.
#
# runs-on: ubuntu-latest deliberately: this repo is PUBLIC and gets unlimited
# free GitHub-hosted minutes, so a self-hosted or CodeBuild runner would spend
# money to do what is free here (cost-management-policy).
#
# The changelog tooling is real code — it writes to
# s3://alpha-engine-research/changelog/entries/ on the daily aggregate cron —
# and `scripts/` is where its tests live. `pytest scripts/` is the whole
# suite; there is no other test directory in this repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # PyYAML is the only third-party import the suite reaches
      # (changelog_log.py's vocab loader). Pinned rather than floating: an
      # unpinned install lets an upstream release turn `main` red here with no
      # commit in this repo, surfacing on whichever unrelated PR runs next
      # (alpha-engine-config-I5854).
      - name: Install test deps
        run: python -m pip install --quiet 'pytest==8.3.4' 'PyYAML==6.0.2' 'basedpyright==1.40.2' 'ruff==0.14.14'

      - name: Run suite
        run: python -m pytest scripts/ -q

      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any rule means the baseline was
      # regenerated to absorb new errors, which is refused.
      - name: Type check (basedpyright strict, baseline may only shrink)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          basedpyright --pythonpath "$(command -v python)"
          ruff check --select ANN --ignore ANN401 --exclude 'scripts/test_*.py' scripts/
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi
