name: Publish API docs to GitHub Pages

# Builds the mkdocs landing page (root mkdocs.yml / docs/) plus one
# mkdocstrings sub-site per public Crucible code repo (api-src/<repo>/,
# each with its own mkdocs.yml scoped to that repo's build-time checkout —
# see api-src/README.md for why this is split per-repo instead of one
# combined config), assembles them into a single site/ tree with each
# sub-site under site/api/<repo>/, and deploys to GitHub Pages.
#
# alpha-engine-config#2646: Option A (mkdocstrings + mkdocs-material +
# GitHub Pages directly in this repo), per Brian's 2026-07-16 operator
# ruling. Only PUBLIC Crucible repos are checked out/rendered — see the
# matrix below and api-src/README.md's "Public-repo scope" section.
#
# One-time enablement: Pages must exist with Source = "GitHub Actions"
# (`build_type: workflow`). Until it does, the build succeeds and the deploy
# job's actions/deploy-pages step fails "Not Found (404) ... Ensure GitHub
# Pages has been enabled" — which is exactly how this workflow spent its
# first four graded runs (alpha-engine-config-I10338): this comment used to
# say the toggle was "repo Settings UI only", and nobody had toggled it.
# That claim was wrong. Measured 2026-09-12: the REST API does it —
#   gh api -X POST repos/nousergon/nousergon-docs/pages -f build_type=workflow
# — and the next workflow_dispatch run (34710704030) deployed to
# https://nousergon.github.io/nousergon-docs/. If the site ever reads
# `has_pages: false` again, that one call is the fix, not a UI visit.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "api-src/**"
      - "scripts/check_api_coverage.py"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC — picks up docstring changes merged to the
    # public repos' `main` since the last build, without needing a push to
    # THIS repo. Ahead of aggregate-changelog-weekly.yml's Monday 07:00 UTC
    # run so a docs refresh and the weekly changelog rollup land the same
    # morning.
    - cron: "0 6 * * 1"

concurrency:
  group: publish-docs
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      uncovered: ${{ steps.subsites.outputs.uncovered }}
    steps:
      - name: Checkout nousergon-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install mkdocs tooling
        run: |
          pip install --disable-pip-version-check \
            mkdocs \
            mkdocs-material \
            "mkdocstrings[python]" \
            dash

      - name: Build landing page
        run: mkdocs build --strict --site-dir /tmp/site-root

      # Public repos only (alpha-engine-config#2646) — verified visibility
      # via `gh repo view nousergon/<repo> --json visibility` for all 8
      # repos before this list was written. alpha-engine-config and any
      # other private/*-ops repo must NEVER be added here: this workflow's
      # build output is published to a public GitHub Pages site.
      - name: Build per-repo API sub-sites
        id: subsites
        run: |
          set -euo pipefail
          # Each api-src/<repo>/mkdocs.yml's `paths:` already points at the
          # right subdir for that repo's layout (checkout/src for
          # nousergon-lib's src/ package layout, checkout for the other
          # flat-layout repos) — nothing repo-specific needed here beyond
          # the clone itself.
          uncovered=0
          for repo in nousergon-lib crucible-executor nousergon-data crucible-predictor crucible-research crucible-backtester crucible-dashboard crucible-evaluator; do
            echo "::group::${repo}"
            src_dir="api-src/${repo}"
            checkout_dir="${src_dir}/checkout"
            rm -rf "${checkout_dir}"
            git clone --depth 1 "https://github.com/nousergon/${repo}.git" "${checkout_dir}"
            rm -rf "${checkout_dir}/.git"
            # API coverage (alpha-engine-config-I12650): every top-level
            # package in the checkout must be rendered by docs/index.md or
            # declared in exclude.txt with a reason. Warn-only here, so a
            # gap never blocks the weekly refresh; the `api-coverage` job
            # below turns a gap red on the scheduled run. Exit 2 (the check
            # cannot read its own declarations) fails the build outright.
            rc=0
            python3 scripts/check_api_coverage.py "${src_dir}" --enforce || rc=$?
            case "${rc}" in
              0) ;;
              1) uncovered=$((uncovered + 1)) ;;
              *) exit "${rc}" ;;
            esac
            # Not --strict here (unlike the landing-page build above): griffe
            # warns on docstring-formatting quirks in the SOURCE repos (odd
            # indentation, undocumented params) that this repo doesn't
            # control and shouldn't be able to break this workflow over —
            # verified locally per-repo (nousergon-lib, crucible-executor)
            # that these are pre-existing cosmetic warnings, not structural
            # errors; the pages still render correctly.
            (cd "${src_dir}" && mkdocs build --site-dir "/tmp/site-root/api/${repo}")
            rm -rf "${checkout_dir}"
            echo "::endgroup::"
          done
          echo "uncovered=${uncovered}" >> "${GITHUB_OUTPUT}"

      - name: Assemble final site
        run: |
          mkdir -p site
          cp -r /tmp/site-root/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # alpha-engine-config-I12650: a package added to a public repo used to
  # never reach the reference, and nothing went red. The build job above
  # annotates each uncovered package with ::warning:: on every run; this job
  # fails the SCHEDULED run (the weekly refresh, which is when a new upstream
  # package first becomes visible here) so the gap pages through the normal
  # red-workflow path without anyone reading annotations. It is a separate job
  # so the deploy still ships the refreshed reference for every covered repo.
  # PR and push runs stay warn-only: a commit to THIS repo cannot add an
  # upstream package, so failing it would only block unrelated docs work.
  api-coverage:
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a sub-site leaves a package uncovered
        env:
          UNCOVERED: ${{ needs.build.outputs.uncovered }}
        run: |
          if [ "${UNCOVERED:-0}" != "0" ]; then
            echo "::error::${UNCOVERED} API sub-site(s) leave a top-level package uncovered; see the build job's warnings. Fix: add a ::: block to api-src/<repo>/docs/index.md, or declare the package in api-src/<repo>/exclude.txt with a reason."
            exit 1
          fi
          echo "All API sub-sites cover every top-level package."

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
